name: Main quality gate

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read
  packages: write

concurrency:
  group: main-quality-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  android:
    name: Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Java
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Build installable MVP APK
        working-directory: android
        run: ./gradlew --no-daemon :app:assembleDebug :app:lintDebug

      - name: Upload APK
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: jarvis-android-mvp-${{ github.sha }}
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

  backend:
    name: Backend checks
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip

      - name: Install project
        run: python -m pip install --editable ".[dev]"

      - name: Check code quality
        run: |
          python -m ruff check .
          python -m ruff format --check .

      - name: Run tests
        run: |
          python -m compileall -q backend/src
          python -m pytest

      - name: Build immutable backend image
        run: docker build --file docker/backend.Dockerfile .

  publish:
    name: Publish production image
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs:
      - android
      - backend
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Authenticate to GitHub Container Registry
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: echo "$GHCR_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin

      - name: Build and publish commit image
        env:
          REGISTRY_IMAGE: ghcr.io/${{ github.repository }}/backend
        run: |
          image=$(echo "$REGISTRY_IMAGE" | tr '[:upper:]' '[:lower:]')
          docker build --file docker/backend.Dockerfile --tag "$image:${GITHUB_SHA}" .
          docker push "$image:${GITHUB_SHA}"
          manifest=$(docker buildx imagetools inspect "$image:${GITHUB_SHA}" --format '{{.Manifest.Digest}}')
          digest="$image@$manifest"
          echo "### Production image" >> "$GITHUB_STEP_SUMMARY"
          echo '\`'"$digest"'\`' >> "$GITHUB_STEP_SUMMARY"
